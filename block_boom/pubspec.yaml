name: block_boom
description: "Block Boom — головоломка с блоками"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sfx/

  fonts:
    - family: Russo
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
