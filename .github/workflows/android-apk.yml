name: Android APK (signed)

on:
  workflow_dispatch:
  push:
    branches: [ci/ios-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # В репо нет папки android — генерируем на лету (как ios в ios-ipa.yml)
      - name: Generate Android project
        run: |
          [ -d android ] || flutter create --platforms=android --org com.kogpk .

      # Flutter подписывает release ключом ~/.android/debug.keystore (см. kogpk-signing)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep -i "SHA256:" | tee /tmp/sha.txt
          grep -q "09:5E:4F:5C:14:FA:82:9C" /tmp/sha.txt

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify signature
        run: |
          APKS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKS" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256"

      - name: Rename
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "KOGPK_Schedule_${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KOGPK_Schedule_apk
          path: KOGPK_Schedule_*.apk
